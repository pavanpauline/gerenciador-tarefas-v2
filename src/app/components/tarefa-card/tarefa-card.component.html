<ion-item-sliding class="task-sliding-item">
  <!-- Deslizar para a direita: concluir (ou desfazer, se já estiver concluída) -->
  <ion-item-options side="start" (ionSwipe)="aoDeslizarConcluir()">
    <ion-item-option
      expandable
      [class]="tarefa().concluida ? 'sliding-opt-undo' : 'sliding-opt-complete'"
      (click)="aoDeslizarConcluir()"
    >
      <div class="opt-content">
        <ion-icon [name]="tarefa().concluida ? 'arrow-undo-outline' : 'checkmark-circle-outline'" aria-hidden="true"></ion-icon>
        <span>{{ tarefa().concluida ? 'Desfazer' : 'Concluir' }}</span>
      </div>
    </ion-item-option>
  </ion-item-options>

  <ion-item lines="none" class="task-sliding-inner">
    <ion-card class="task-card" [class.is-done]="tarefa().concluida">
      <div class="task-checkbox-wrap">
        <ion-checkbox
          class="circle-checkbox"
          [checked]="tarefa().concluida"
          (ionChange)="aoMarcar($event)"
          [attr.aria-label]="(tarefa().concluida ? 'Marcar como pendente: ' : 'Marcar como concluída: ') + tarefa().titulo"
        ></ion-checkbox>
      </div>

      <!-- Área que abre os detalhes: um botão de verdade, acessível pelo teclado -->
      <button type="button" class="task-main" (click)="abrir.emit(tarefa())">
        <span class="task-details">
          <span class="task-title">{{ tarefa().titulo }}</span>
          <span class="task-meta">
            <span class="category-name">{{ tarefa().categoria }}</span>
            <span class="meta-dot" aria-hidden="true">•</span>
            @if (tarefa().concluida) {
              <span>Concluída</span>
            } @else {
              <span class="deadline-wrap" [class.is-late]="atrasada()">
                <ion-icon [name]="atrasada() ? 'alert-circle-outline' : 'time-outline'" class="clock-icon" aria-hidden="true"></ion-icon>
                {{ textoPrazo() }}
                @if (atrasada()) {
                  <span class="sr-only">(atrasada)</span>
                }
              </span>
            }
          </span>
        </span>

        <span class="task-badge-wrap">
          @if (tarefa().concluida) {
            <ion-badge class="priority-tag tag-done">Concluída</ion-badge>
          } @else {
            <ion-badge [class]="classePrioridade()">
              <ion-icon name="cellular-outline" aria-hidden="true"></ion-icon>
              {{ tarefa().prioridade }}
            </ion-badge>
          }
        </span>
      </button>
    </ion-card>
  </ion-item>

  <!-- Deslizar para a esquerda: apagar -->
  <ion-item-options side="end" (ionSwipe)="aoDeslizarExcluir()">
    <ion-item-option expandable class="sliding-opt-delete" (click)="aoDeslizarExcluir()">
      <div class="opt-content">
        <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
        <span>Apagar</span>
      </div>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
